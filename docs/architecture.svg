<svg xmlns="http://www.w3.org/2000/svg" width="680" height="468" viewBox="0 0 680 468" role="img" font-family="Segoe UI, Calibri, Arial, sans-serif">
<title>Hybrid PV-Wind architecture, 150 kVA DC-coupled</title>
<desc>A 120 kWp PV array through a boost converter with P and O MPPT, and a 60 kW wind turbine through a rectifier and boost with wind MPPT, both feed a shared 700 V DC bus. One 150 kVA grid-tie inverter with LCL filter connects to a 400 V point of common coupling, where the 250 kW site load, the RLC anti-islanding test load, and the breaker to the grid all connect.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="468" fill="#FFFFFF"/>

<rect x="90" y="40" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="190" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">PV array</text>
<text x="190" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">120 kWp DC</text>
<rect x="390" y="40" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="490" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">wind turbine</text>
<text x="490" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">60 kW &#183; R 6.46 m</text>
<line x1="190" y1="98" x2="190" y2="110" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="490" y1="98" x2="490" y2="110" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="90" y="116" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="190" y="134" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">DC/DC boost</text>
<text x="190" y="154" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">P&amp;O MPPT</text>
<rect x="390" y="116" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="490" y="134" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">rectifier + boost</text>
<text x="490" y="154" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">wind MPPT</text>
<line x1="190" y1="174" x2="190" y2="186" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="490" y1="174" x2="490" y2="186" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="90" y="192" width="500" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="214" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">shared DC bus &#183; 700 V</text>
<line x1="340" y1="238" x2="340" y2="250" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="90" y="256" width="500" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="274" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">grid-tie inverter</text>
<text x="340" y="294" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">150 kVA VSI + LCL filter</text>
<line x1="340" y1="314" x2="340" y2="326" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="90" y="332" width="500" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="354" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">PCC &#183; 400 V</text>
<line x1="165" y1="378" x2="165" y2="388" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="378" x2="340" y2="388" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="515" y1="378" x2="515" y2="388" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="90" y="392" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="165" y="410" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">site load</text>
<text x="165" y="430" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">250 kW</text>
<rect x="265" y="392" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="410" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">RLC test load</text>
<text x="340" y="430" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">50 Hz, Qf = 1</text>
<rect x="440" y="392" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="515" y="410" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">breaker &#8594; grid</text>
<text x="515" y="430" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">400 V, 50 Hz</text>
</svg>
